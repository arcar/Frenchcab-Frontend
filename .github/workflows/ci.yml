# .github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - dev
      - staging
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npx ng test --watch=false

  build:
    # Build et push de l'image uniquement sur staging, si les tests passent
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-frontend:latest \
            .

      - name: Push vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frenchcab-frontend:latest
